; Réglages de Bridge Coach. Après un changement : enregistrer, puis fermer et rouvrir Bridge Coach.
[dossiers]
; Le dossier où Bridgemate enregistre ses fichiers .bws, sous-dossiers compris. Bridge Coach ne fait
; qu'y lire : il travaille sur une copie.
bridgemate = ~/Documents/bridgemate-files
; Le dossier de travail : vos séances et vos rapports (seances, rapports). Ce n'est pas le dossier où
; Bridge Coach est installé. Si vous le changez, les fichiers existants ne suivent pas : déplacez-les
; vous-même vers le nouveau dossier.
fichiers = ~/Documents/bridge-coach-files
