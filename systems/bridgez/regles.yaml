# BRIDGEZ (Université du Bridge) : le système qu'apprennent les débutants, aux enchères plus directes.
# Le SEF 2024 avec des conventions coupées (l'utilisateur, 2026-11-19 : pas un second système à entretenir) :
#   base: sef-2024     tout se joue comme le SEF, sauf ce qui est écrit ici ;
#   sans: [...]        les conventions coupées, par leur « nom: » dans le regles.yaml du SEF (Stayman, Texas, Roudi,
#                      Drury, Spoutnik, Bicolores, Landy, 4e couleur forcing ; Blackwood et Spoutnik sont coupés aussi
#                      dans le code). Une enchère coupée laisse la place à l'enchère naturelle d'après ; sans Blackwood,
#                      le robot qui voulait demander les clés dit le chelem directement.
#   une section écrite ici (une séquence, comme "1SA") remplace celle du SEF : pour les enchères plus directes du livre.
# « pret: non » : pas encore proposé aux joueurs. La liste viendra des pages du livre (README.md) : ne rien deviner.
systeme: bridgez
titre: "BRIDGEZ (Université du Bridge)"
base: sef-2024
pret: non
# Première liste (2026-11-21, proposée par Claude, acceptée par l'utilisateur en attendant les pages du livre) :
# on garde Stayman, Texas et Blackwood, appris tôt ; on coupe ce qui rend le SEF difficile à suivre pour un débutant.
sans: [Roudi, Drury, Spoutnik, Bicolores, Landy, 4e couleur forcing]

# ------------------------------------------------------------------ après leur intervention, sans Spoutnik
# (2026-11-21, l'utilisateur : « write natural bids ». Le résumé débutant ne dit rien des interventions : ces
# enchères naturelles sont les nôtres, marquées « à confirmer » jusqu'aux pages du livre.)
# Le contre est punitif (4+ cartes dans leur couleur) ; une majeure 4e se nomme au palier 1 dès 6 HL, au palier 2
# dès 12 HL ; une couleur 5e au palier 2 dès 12 HL (le résumé : nouvelle couleur au palier 2, 12+ HL), au palier 3
# dès 13 H ; le cue-bid est la main forte (13+ H) sans enchère naturelle.
"1M (1x)":
  - "*Y": { si: "U 4+, HLD(U) 13+, palier(Y) 3-", montre: "cue-bid : 4+ cartes de soutien, 13+ points, forcing de manche", nature: cue, atout: U }
  - 4U:  { si: "U 3+, HLD 13+", montre: "fit et 13+ points : manche", nature: conclusion }
  - "*U+1": { si: "U 3+, HLD 11-12, palier(U) 2-", montre: "fit, 11–12 points : invitation", nature: invite }
  - "*U": { si: "U 3+, HLD 6-10, (palier(U) 2- || U 4+, palier(U) 3-)", montre: "soutien, 6–10 points", nature: limite }
  - "*U": { si: "U 3+, HLD 11-12, palier(U) 3", montre: "soutien, 11–12 points (le saut est trop haut)", nature: invite }
  - passe: { si: "U 3+", montre: "fit, mais trop faible pour monter" }
  - passe: { si: "H 5-", montre: "moins de 6 H" }
  - contre: { si: "H 10+, (Y 5+ || Y 4+, palier(Y) 3+)", montre: "contre punitif : 10+ H, 5+ cartes dans leur couleur (4 sur une intervention au palier de 2)", nature: punitif, source: à confirmer }
  - "*P": { si: "P 5+, non U est P, non Y est P, (palier(P) 1, H 6+ || palier(P) 2, HL 12+ || palier(P) 3, H 13+)", montre: "5+ piques", nature: forcing, source: à confirmer }
  - "*C": { si: "C 5+, non U est C, non Y est C, (palier(C) 1, H 6+ || palier(C) 2, HL 12+ || palier(C) 3, H 13+)", montre: "5+ cœurs", nature: forcing, source: à confirmer }
  - "*K": { si: "K 5+, non U est K, non Y est K, (palier(K) 1, H 6+ || palier(K) 2, HL 12+ || palier(K) 3, H 13+)", montre: "5+ carreaux", nature: forcing, source: à confirmer }
  - "*T": { si: "T 5+, non U est T, non Y est T, (palier(T) 1, H 6+ || palier(T) 2, HL 12+ || palier(T) 3, H 13+)", montre: "5+ trèfles", nature: forcing, source: à confirmer }
  - "*P": { si: "P 4, non U est P, non Y est P, (palier(P) 1, HL 6+ || palier(P) 2, HL 12+)", montre: "4 piques", nature: forcing, source: à confirmer }
  - 1SA: { si: "H 8-10, arret Y", montre: "8–10 H, arrêt dans leur couleur", nature: limite }
  - 2SA: { si: "H 11-12, arret Y", montre: "11–12 H, arrêt : invitation", nature: invite }
  - 3SA: { si: "H 13+, arret Y", montre: "13+ H, arrêt : manche", nature: conclusion }
  - "*Y": { si: "H 13+, palier(Y) 3-", montre: "cue-bid : 13+ H sans enchère naturelle, forcing de manche", nature: cue, atout: U, source: à confirmer }
  - passe: { montre: "rien d'adapté après l'intervention" }
  - exemples:
      - { main: "R82 D75 RV73 X52", apres: 1C (1P), attendu: 2C }      # soutien simple
      - { main: "R82 AD75 RV73 52", apres: 1C (1P), attendu: 2P }      # 4 atouts, 13+ : cue-bid
      - { main: "AV987 5 RX4 D976", apres: 1C (1P), attendu: contre }   # punitif : 5 piques, 10 H
      - { main: "RV72 8 D9763 R54", apres: 1C (2T), attendu: passe }   # 9 H, 4 piques : trop peu pour le palier 2

