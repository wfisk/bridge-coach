# SEF 2024 : règles d'enchères lues par le programme (src/regles.py).
# Grammaire complète : ../grammaire.md. Vérifier : .venv/bin/python -I src/regles.py
#
# Aide-mémoire
#   Couleurs T K C P ; honneurs A R D V X ; points H, HL, HLD (HLD(P) : atout pique ;
#   HLD = H + courtes + atouts au-delà du 3e avec un singleton ou une chicane)
#   M / N la plus longue majeure / mineure ; U / W couleur de l'ouvreur / du répondant ;
#   Y / Z couleur de l'intervenant / de son partenaire ; UM : la majeure de l'ouvreur ;
#   S1 à S4 le siège depuis le donneur
#   Zones : 5+ au moins, 1- au plus, 6-10, 1= exactement ; ! le contraire (TKCP !1-)
#   Virgule = et ; || = ou ; parenthèses pour grouper ; non ... ; reg / irreg
#   Première règle vraie dans l'ordre ; - exemples : en fin de liste, vérifiés à chaque lecture.
#   source : SEF (par défaut), à confirmer, SA (emprunté au Standard American).
#   alerte : oui pour une enchère que le partenaire alerte. On alerte : cue-bid Michaels, 4e couleur forcing,
#   3e couleur forcing artificielle, Roudi, Drury, splinter, Jacoby 2SA, soutiens Bergen, Lebensohl, 2SA bicolore,
#   contres artificiels (Spoutnik…), ouvertures artificielles (Multi 2♦, forts non standard). Le moteur ne joue
#   encore ni Roudi, ni splinter, ni Jacoby, ni Bergen, ni Lebensohl, ni Multi (bicolores : cue-bid, 2♦ sur 1♣, 2SA et 3♣, depuis le 2026-11-08).
#   Deux sections pour la même séquence : la plus précise l'emporte (« (1T) 2T » sur « (1x) 2x »).

systeme: sef-2024

definitions:
  # la règle des 15 ne tranche que les mains limites en quatrième : 10-11 H sans couleur de 6 cartes.
  # À 12 H+, ou avec une 6e, on ouvre (mains tirées au hasard, 2026-10-31 : ouvrir rapporte même sans la règle)
  ouvrable: "H 12+ || H 11, S 1-2, regle des 20 || H 11, S 3 || H 10-11, S 4, (regle des 15 || P 6+ || C 6+ || K 6+ || T 6+)"
  leger: "S 3, H 8-10, regle des 20 || S 3, H 10, P + C 9+"
  # exactement 4 cartes dans une majeure que ni l'ouvreur (U) ni l'intervenant (Y) n'ont
  # nommée (avec 5 cartes, on nomme la couleur)
  majeure libre: "C 4, non U est C, non Y est C || P 4, non U est P, non Y est P"

# ------------------------------------------------------------------ ouvertures
ouverture:
  - 2K:  { si: "reg, H 24+ || HL 25+", montre: "forcing de manche", source: à confirmer }
  - 2T:  { si: "reg, H 22-23 || irreg, HL 21-24", montre: "fort indéterminé", source: à confirmer }
  - 2SA: { si: "reg, H 20-21", montre: "20–21 H, régulier" }
  - 1SA: { si: "reg, H 15-17, M 4-", montre: "15–17 H, régulier", note: "avec une majeure 5e : à confirmer" }
  - 1P:  { si: "ouvrable, P 5+, P >= C", montre: "12–21 H, 5+ piques" }
  - 1C:  { si: "ouvrable, C 5+", montre: "12–21 H, 5+ cœurs" }
  - 1K:  { si: "ouvrable, K > T", montre: "12–21 H, 4+ carreaux" }
  - 1K:  { si: "ouvrable, K 4+, K = T", montre: "12–21 H, 4+ carreaux" }
  - 1K:  { si: "ouvrable, forme 4-4-3-2, K 3, T 2", montre: "12–21 H, 4-4 en majeures, 3 carreaux" }
  - 1T:  { si: "ouvrable", montre: "12–21 H, 3+ trèfles" }
  - 2P:  { si: "H 6-10, P 6, C 3-, S 1-3, non VN || H 8-10, P 6, C 3-, S 1-3", montre: "faible, 6 piques", source: à confirmer }
  - 2C:  { si: "H 6-10, C 6, P 3-, S 1-3, non VN || H 8-10, C 6, P 3-, S 1-3", montre: "faible, 6 cœurs", source: à confirmer }
  - 3P:  { si: "H 6-10, P 7+, S 1-3, non VN || H 8-10, P 7+, S 1-3", montre: "barrage, 7 piques" }
  - 3C:  { si: "H 6-10, C 7+, S 1-3, non VN || H 8-10, C 7+, S 1-3", montre: "barrage, 7 cœurs" }
  - 3K:  { si: "H 6-10, K 7+, S 1-3, non VN || H 8-10, K 7+, S 1-3", montre: "barrage, 7 carreaux" }
  - 3T:  { si: "H 6-10, T 7+, S 1-3, non VN || H 8-10, T 7+, S 1-3", montre: "barrage, 7 trèfles" }
  # en troisième, ouverture légère pour les mains qui ne barrent pas (un barrage y rapporte plus)
  - 1P:  { si: "leger, P 5+, P >= C", montre: "ouverture légère en troisième" }
  - 1C:  { si: "leger, C 5+", montre: "ouverture légère en troisième" }
  - 1K:  { si: "leger, K >= T", montre: "ouverture légère en troisième" }
  - 1T:  { si: "leger", montre: "ouverture légère en troisième" }
  - passe: { montre: "pas d'ouverture" }
  - exemples:
      - { main: "A765 AX43 A982 3", position: 1, attendu: 1K }     # donne 2 du 23/10
      - { main: "AR5 D84 RV7 A962", position: 1, attendu: 1SA }
      - { main: "RD7652 85 X42 V3", position: 1, attendu: 2P }
      - { main: "RD7652 85 X42 V3", position: 4, attendu: passe }
      - { main: "5 RX96543 R2 AD5", position: 4, attendu: 1C }             # donne 15 du 30/10 : 12 H, règle des 15 non remplie
      - { main: "AD984 8 RV63 X62", position: 4, attendu: 1P }             # 10 H + 5 piques
      - { main: "A5 RV842 RX3 932", position: 4, attendu: passe }          # 11 H + 2 piques
      - { main: "5 AV96543 R2 R52", position: 4, attendu: 1C }             # 11 H, sept cœurs
      - { main: "DX82 ARV96 85 72", position: 3, attendu: 1C }             # donne 17 du 30/10 : neuf cartes en majeures
      - { main: "8 - AD9842 R76321", position: 3, attendu: 1K }            # 9 H, règle des 20
      - { main: "DX8 ARV96 852 72", position: 3, attendu: passe }          # 10 H + 5 + 3 = 18
      - { main: "A5 842 R4 RV9732", position: 4, attendu: 1T }             # 11 H, six trèfles
      - { main: "RD7652 85 X42 V3", position: 1, vul: VN, attendu: passe }   # 7 H : trop faible en VN (vulnérables contre non vulnérables)
      - { main: "RD7652 85 X42 V3", position: 1, vul: VV, attendu: 2P }
      - { main: "AV32 RD54 V72 D3", position: 1, attendu: 1K }

# ------------------------------------------------------------------ réponses à 1SA (15–17) et 2SA (20–21)
# Texas (../conventions/texas.md) et Stayman (../conventions/stayman.md), puis les SA selon
# le total : 25 pour la manche, 31 pour le quantitatif, 33 pour le petit chelem, 37 pour le grand.
"1SA":
  - 2C:  { si: "P 5+, P >= C", montre: "texas : 5+ piques", nature: relais, nom: texas }
  - 2K:  { si: "C 5+", montre: "texas : 5+ cœurs", nature: relais, nom: texas }
  - 2T:  { si: "H 8+, M 4, non forme 4-3-3-3", montre: "Stayman : une majeure 4e, 8+ H", nature: relais, nom: Stayman }
  - 7SA: { si: "H 22+", montre: "grand chelem : 37+ points ensemble", nature: conclusion }
  - 6SA: { si: "H 18-21", montre: "petit chelem : 33+ points ensemble", nature: conclusion }
  - 4SA: { si: "H 16-17", montre: "quantitatif : invite au chelem", nature: invite }
  - 3SA: { si: "H 10-15", montre: "manche", nature: conclusion }
  - 2SA: { si: "H 8-9", montre: "invitation à 3SA", nature: invite }
  - passe: { si: "H 7-", montre: "pas de manche possible" }
  - exemples:
      - { main: "RV752 D84 X63 92", attendu: 2C }        # 5 piques : texas
      - { main: "R752 AD84 X63 92", attendu: 2T }        # 4 cœurs, 4 piques, 9 H : Stayman
      - { main: "R75 D84 AX63 932", attendu: 2SA }       # 9 H
      - { main: "R75 D84 AX63 R92", attendu: 3SA }

"2SA":
  - 3C:  { si: "P 5+, P >= C", montre: "texas : 5+ piques", nature: relais, nom: texas }
  - 3K:  { si: "C 5+", montre: "texas : 5+ cœurs", nature: relais, nom: texas }
  - 3T:  { si: "H 3+, M 4, non forme 4-3-3-3", montre: "Stayman : une majeure 4e", nature: relais, nom: Stayman, source: à confirmer }
  - 4T:  { si: "T 6+, T >= K, H 9-12", montre: "6+ trèfles, essai de chelem", nature: soutien_lent, source: à confirmer }
  - 4K:  { si: "K 6+, H 9-12", montre: "6+ carreaux, essai de chelem", nature: soutien_lent, source: à confirmer }
  - 7SA: { si: "H 17+", montre: "grand chelem", nature: conclusion }
  - 6SA: { si: "H 13-16", montre: "petit chelem", nature: conclusion }
  - 4SA: { si: "H 11-12", montre: "quantitatif : invite au chelem", nature: invite }
  - 3SA: { si: "H 5-10", montre: "manche", nature: conclusion }
  - passe: { si: "H 4-", montre: "pas de manche possible" }
  - exemples:
      - { main: "V8752 84 X63 932", attendu: 3C }        # texas même faible
      - { main: "R75 D84 X763 V92", attendu: 3SA }

# Réponses de l'ouvreur au Stayman et aux texas
"1SA - 2T":
  - 2C:  { si: "C 4+", montre: "4 cœurs, peut avoir 4 piques" }
  - 2P:  { si: "P 4+", montre: "4 piques, pas 4 cœurs" }
  - 2K:  { montre: "pas de majeure 4e" }
"1SA - 2K":
  - 2C:  { montre: "complète le texas", nature: relais }
"1SA - 2C":
  - 2P:  { montre: "complète le texas", nature: relais }
"2SA - 4T | 2SA - 4K":
  - exemples:
      - { main: "2 RV2 642 AV8754", apres: 2SA, attendu: 4T }     # donne 20 du 01/11 (214059)
"2SA - 3T":
  - 3C:  { si: "C 4+", montre: "4 cœurs, peut avoir 4 piques", source: à confirmer }
  - 3P:  { si: "P 4+", montre: "4 piques, pas 4 cœurs", source: à confirmer }
  - 3K:  { montre: "pas de majeure 4e", source: à confirmer }
"2SA - 3K":
  - 3C:  { montre: "complète le texas", nature: relais }
"2SA - 3C":
  - 3P:  { montre: "complète le texas", nature: relais }

# ------------------------------------------------------------------ redemande de l'ouvreur après 1T - 1SA, 1K - 1SA
# Le répondant a 6–10 H sans majeure 4e : l'ouvreur passe avec une main minimum régulière
# ou 4-4-4-1, répète une 6e, nomme une autre mineure 4e, propose la manche avec 18–19.
"1N - 1SA":
  - 2SA: { si: "reg, H 18-19", montre: "18–19 H, régulier, invitation", nature: invite }
  - 3U:  { si: "U 6+, H 16-18", montre: "16–18 H, 6+ cartes, invitation", nature: invite }
  - 2K:  { si: "K 4+, H 11-17, irreg", montre: "4+ carreaux, irrégulier", apres: 1T - 1SA }
  - 2T:  { si: "T 4+, H 11-17, irreg, non forme 4-4-4-1", montre: "4+ trèfles, irrégulier", apres: 1K - 1SA }
  - 2U:  { si: "U 6+, H 11-15", montre: "6+ cartes, minimum" }
  - 3SA: { si: "H 18+", montre: "18+ H, manche", nature: conclusion, source: SA }
  - passe: { si: "H 11-17", montre: "minimum, pas d'enchère utile" }
  - exemples:
      - { main: "A765 AX43 A982 3", apres: 1K - 1SA, attendu: passe }   # donne 2 du 23/10 (E)
      - { main: "AD3 R4 A82 RDV52", apres: 1T - 1SA, attendu: 2SA }
      - { main: "R4 A3 AD9752 V82", apres: 1K - 1SA, attendu: 2U }

# ------------------------------------------------------------------ réponses à 1♥ / 1♠ (adversaires silencieux)
# « 1M » vaut pour 1C et 1P ; U = la couleur de l'ouvreur. Une enchère impossible
# (1P après 1P) est sautée ; « apres: 1P » réserve une règle à une seule des séquences.
"1M | 1M (contre)":
  - passe: { si: "U 3+, HLD(U) 5-", montre: "moins de 6 points" }
  - 4U:  { si: "U 5+, H 5-10, (T 1- || K 1- || C 1- || P 1-)", montre: "fermeture : 5+ atouts, moins de 11 H, un singleton ou une chicane" }
  # Drury : main passée (siège 1 ou 2), l'ouverture en 3e ou 4e ; 2♣ artificiel (conventions/drury.md)
  - 2T:  { si: "S 1-2, U 3+, HLD(U) 10-12", montre: "Drury : main passée, 3+ atouts, 10–12 points", nature: drury, nom: Drury, source: à confirmer, apres: 1C | 1P, alerte: oui }
  - 2U:  { si: "U 3+, HLD 6-10", montre: "soutien simple, 6–10 points, 3+ cartes" }
  - 3U:  { si: "U 3+, HLD 11-12, (U 4+ || non P 5+)", montre: "soutien limite, 11–12 points ; avec trois atouts et cinq piques, 1♠ d'abord", source: à confirmer }
  - 2C:  { si: "U 3+, HLD 13+, C 5+, C > K, C > T", montre: "13+ points, fit différé", apres: 1P }
  - 2K:  { si: "U 3+, HLD 13+, K 4+, K > T", montre: "13+ points, fit différé" }
  - 2T:  { si: "U 3+, HLD 13+, T 4+", montre: "13+ points, fit différé" }
  - 2K:  { si: "U 3+, HLD 13+, K > T", montre: "13+ points, fit différé" }
  - 2T:  { si: "U 3+, HLD 13+", montre: "13+ points, fit différé" }
  - passe: { si: "H 5-", montre: "moins de 6 H" }
  - 1P:  { si: "H 6+, P 4+", montre: "6+ H, 4+ piques" }
  - 1SA: { si: "H 6-10", montre: "6–10 H, sans fit" }
  - 2C:  { si: "H 11+, C 5+, C > K, C > T", montre: "11+ H, 5+ cœurs, forcing", apres: 1P }
  - 2K:  { si: "H 11+, K 4+, K > T", montre: "11+ H, 4+ carreaux, forcing" }
  - 2T:  { si: "H 11+, T 4+", montre: "11+ H, 4+ trèfles, forcing" }
  - 2K:  { si: "H 11+, K > T", montre: "11+ H, forcing" }
  - 2T:  { si: "H 11+", montre: "11+ H, forcing" }
  - exemples:
      - { main: "R82 D75 RV73 X52", apres: 1C, attendu: 2U }     # 9 H, 3 cœurs
      - { main: "AV82 75 RV73 X52", apres: 1C, attendu: 1P }
      - { main: "AV82 75 RV73 X52", apres: 1P, attendu: 2U }     # 4 piques, 9 H + 1 (doubleton)
      - { main: "V82 R7 RV73 DV52", apres: 1P, attendu: 3U }
      - { main: "RX9832 X9 A632 9", apres: 1P, attendu: 4U }     # 6 atouts, singleton : manche
      - { main: "754 X5 ARV63 V94", apres: 1P, position: 2, attendu: 2T }   # main passée, 3 atouts, HLD 10 : Drury
      - { main: "754 X5 ARV63 V94", apres: 1P, attendu: 2U }                # la même, pas passée : soutien simple

# ------------------------------------------------------------------ réponses à 1♣ (adversaires silencieux)
"1T | 1T (contre)":
  - passe: { si: "H 0-5", montre: "moins de 6 H" }
  - 1K:  { si: "H 12+, M 4+, K 5+, K > M", montre: "12+ H, forcing de manche : la plus longue d'abord" }
  - 1P:  { si: "H 6+, P 5+, P > C", montre: "6+ H, 5+ piques" }
  - 1C:  { si: "H 6+, C 4+", montre: "6+ H, 4+ cœurs" }
  - 1P:  { si: "H 6+, P 4+", montre: "6+ H, 4+ piques" }
  - 1K:  { si: "H 6+, K 4+, (H 6-10 || irreg)", montre: "6+ H, 4+ carreaux" }
  - 2T:  { si: "H 6-10, T 5+, irreg", montre: "6–10 H, 5+ trèfles" }
  - 1SA: { si: "H 6-10", montre: "6–10 H, sans majeure 4e" }
  - 2SA: { si: "reg, H 11-12", montre: "11–12 H, régulier, sans majeure 4e" }
  - 3SA: { si: "reg, H 13-15", montre: "13–15 H, régulier, sans majeure 4e" }
  - 3T:  { si: "H 11-12, T 5+", montre: "11–12 H, 5+ trèfles, invitation", source: SA }
  - 1K:  { si: "H 13+", montre: "13+ H, forcing (carreaux parfois 3 cartes)", source: SA }
  - exemples:
      - { main: "X82 D75 RV7 DV53", attendu: 1SA }
      - { main: "X8 D7 V73 RDV853", attendu: 2T }
      - { main: "V8 AX98 A4 RDV52", attendu: 1C }     # 12+ H : la majeure, pas 2T (soutien faible)
      - { main: "D32 DV3 AR AR865", attendu: 1K }     # 19 H sans majeure : forcing

# ------------------------------------------------------------------ réponses à 1♦ (adversaires silencieux)
"1K | 1K (contre)":
  - passe: { si: "H 0-5", montre: "moins de 6 H" }
  - 2T:  { si: "H 12+, M 4+, T 5+, T > M", montre: "12+ H, forcing de manche : la plus longue d'abord" }
  - 1P:  { si: "H 6+, P 5+, P > C", montre: "6+ H, 5+ piques" }
  - 1C:  { si: "H 6+, C 4+", montre: "6+ H, 4+ cœurs" }
  - 1P:  { si: "H 6+, P 4+", montre: "6+ H, 4+ piques" }
  - 2K:  { si: "H 6-10, K 5+ || H 6-10, K 4, irreg", montre: "6–10 H, soutien carreau",
           note: "avec une main régulière, 1SA d'abord" }
  - 1SA: { si: "H 6-10", montre: "6–10 H, sans majeure 4e" }
  - 2SA: { si: "reg, H 11-12", montre: "11–12 H, régulier, sans majeure 4e" }
  - 3SA: { si: "reg, H 13-15", montre: "13–15 H, régulier, sans majeure 4e" }
  - 2T:  { si: "H 11+, T 4+", montre: "11+ H, 4+ trèfles, forcing" }
  - 3K:  { si: "H 11-12, K 5+", montre: "11–12 H, 5+ carreaux, invitation", source: SA }
  - 2T:  { si: "H 13+", montre: "13+ H, forcing (trèfles parfois 3 cartes)", source: SA }
  - exemples:
      - { main: "VX73 AD32 AV742 -", attendu: 1C }    # 12+ H : la majeure, pas 2K (soutien faible)
      - { main: "AV8 AX3 ADX84 DV", attendu: 2T }     # 18 H sans majeure : forcing
      - { main: "V82 D75 RV73 DV5", attendu: 1SA }                 # donne 2 du 23/10 (O)
      - { main: "V8 75 RV732 D952", attendu: 2K }
      - { main: "RV82 D7 RV73 X52", attendu: 1P }

# ================================================================== redemandes de l'ouvreur
# U = la couleur de l'ouvreur, W = celle du répondant. Bicolore cher (« reverse ») : une
# deuxième couleur plus chère que la première au palier de 2, 17+ HL, forcing.

# ------------------------------------------------------------------ après une réponse au palier de 1
"1T - 1K":
  - 2SA: { si: "reg, H 18-19", montre: "18–19 H, régulier", nature: invite }
  - 1C:  { si: "C 4+, C >= P, H 11-18", montre: "4+ cœurs", source: SA, note: "les majeures 4e d'abord, avant 1SA" }
  - 1P:  { si: "P 4+, H 11-18", montre: "4+ piques", source: SA }
  - 1SA: { si: "reg, H 11-14", montre: "12–14 H, régulier, sans majeure 4e", nature: limite }
  - 2K:  { si: "K 4+, T 4-, H 11-14", montre: "12–14, fit carreau", nature: limite }
  - 3T:  { si: "T 6+, HL 16-18", montre: "16–18, 6+ trèfles", nature: invite }
  - 2T:  { si: "HL 11-15, T 6+", montre: "12–15, 6+ trèfles", nature: limite }
  - 2T:  { si: "H 11-17", montre: "trèfles répétés" }
  - exemples:
      - { main: "AV63 R4 D72 AV82", attendu: 1P }
      - { main: "A63 R74 D72 AV82", attendu: 1SA }

"1N - 1M":                         # 1T - 1C, 1T - 1P, 1K - 1C, 1K - 1P
  - 4W:  { si: "W 4+, HLD 18+", montre: "18+ points, 4 cartes dans la majeure du répondant", nature: conclusion }
  - 3W:  { si: "W 4+, HLD 15-17, H 13+", montre: "15–17 points, 4 cartes, invitation", nature: invite }
  - 2W:  { si: "W 4+, HLD 11-17", montre: "12–14 points, 4 cartes", nature: limite }
  - 1P:  { si: "P 4+, H 11-18", montre: "4 piques", apres: 1T - 1C | 1K - 1C }
  - 2SA: { si: "reg, H 18-19", montre: "18–19 H, régulier", nature: invite }
  - 1SA: { si: "reg, H 11-14", montre: "12–14 H, régulier", nature: limite }
  - 2C:  { si: "HL 17-21, C 4+, C >= K, T 5-", montre: "bicolore cher, 17+ HL", nature: forcing, apres: 1T - 1P }
  - 2K:  { si: "HL 17-21, K 4+, T 5-", montre: "bicolore cher, 17+ HL", nature: forcing, apres: 1T - 1C | 1T - 1P }
  - 2C:  { si: "HL 17-21, C 4+, K 5-", montre: "bicolore cher, 17+ HL", nature: forcing, apres: 1K - 1P }
  - 2T:  { si: "T 4+, K 5-, H 11-17", montre: "deuxième couleur, 4+ trèfles", apres: 1K - 1C | 1K - 1P }
  - 3U:  { si: "U 6+, HL 16-18", montre: "16–18, 6+ cartes", nature: invite }
  - 2U:  { si: "HL 11-15, U 6+", montre: "12–15, 6+ cartes", nature: limite }
  - 2U:  { si: "H 11-17", montre: "couleur répétée" }
  - exemples:
      - { main: "R83 AV74 72 AV82", apres: 1T - 1C, attendu: 2C }   # 4 cœurs, 13 H + 1 : soutien simple
      - { main: "R83 AV7 D72 R982", apres: 1T - 1C, attendu: 1SA }
      - { main: "R8 A7 AD732 RV82", apres: 1K - 1P, attendu: 2T }

"1C - 1P":
  - 4P:  { si: "P 4+, HLD 18+", montre: "18+ points, 4 piques", nature: conclusion }
  - 3P:  { si: "P 4+, HLD 15-17", montre: "15–17 points, 4 piques", nature: invite }
  - 2P:  { si: "P 4+, HLD 11-14", montre: "12–14 points, 4 piques", nature: limite }
  - 2SA: { si: "reg, H 18-19", montre: "18–19 H, régulier", nature: invite }
  - 1SA: { si: "reg, H 11-14", montre: "12–14 H, régulier", nature: limite }
