# 4e couleur (11+ H) puis 2SA : 23 points au moins. Le fit dans la couleur de l'ouvreur donne des
# levées de longueur : avec 11 H et quatre cartes à deux gros honneurs (AR, AD, RD : 5+ H dans la couleur), la manche.
"1T - 1C - 1P - 2K - 2SA | 1K - 1C - 1P - 2T - 2SA | 1T - 1K - 1P - 2C - 2SA | 1K - 1C - 2T - 2P - 2SA | 1K - 1P - 2T - 2C - 2SA | 1C - 1P - 2T - 2K - 2SA":
  - 3SA: { si: "H 12+ || U 4+, H(U) 5+", montre: "manche", nature: conclusion }
  - passe: { montre: "11 H sans fit : 2SA suffit" }
