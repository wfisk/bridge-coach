# ------------------------------------------------------------------ le résumé débutant (2026-11-21) : les réponses
# Copiées du SEF avec ce qui change d'après le résumé débutant de l'utilisateur : 1M – 4M = 3+ atouts et 13–16 HLD (le
# fit différé reste pour 17+) ; 1M – 2SA / 3SA = 11–12 / 13–15 H réguliers sans fit ; le soutien mineur promet cinq
# cartes, 1m – 4m = 13–16 HLD irrégulier. Le reste est celui du SEF.
"1M | 1M (contre)":
  - passe: { si: "U 3+, HLD(U) 5-", montre: "moins de 6 points" }
  - surcontre: { si: "H 10+, non (P 5+, non U est P), non (U 4+, HLD(U) 11-15)", montre: "surcontre : 10+ H (SEF 2024 p. 13 et 21)", nature: forcing, apres: 1C (contre) | 1P (contre) }
  - 4U:  { si: "U 5+, H 5-10, (T 1- || K 1- || C 1- || P 1-)", montre: "fermeture : 5+ atouts, moins de 11 H, un singleton ou une chicane" }
  # Drury fitté (SEF 2024 p. 20) : main passée (siège 1 ou 2), l'ouverture en 3e ou 4e ; 2♣ artificiel : trois atouts
  # et 11+ HLD, ou quatre atouts et 11+ HLD sans singleton ni chicane (conventions/drury.md). Une main passée n'a pas
  # 13 H : jamais le fit différé (forcing de manche). Quatre atouts et une courte : le soutien limite à 3 (le SEF réserve
  # le Splinter aux cinq atouts après Passe).
  - 2T:  { si: "S 1-2, HLD(U) 11+, (U 3 || U 4+, TKCP !1-)", montre: "Drury : main passée, 3 atouts (ou 4 sans courte), 11+ points", nature: drury, nom: Drury, source: SEF 2024, apres: 1C | 1P, alerte: oui }
  - 3U:  { si: "S 1-2, U 4+, HLD(U) 11+", montre: "main passée : 4+ atouts, une courte, 11+ points", nature: limite, source: à confirmer }
  - 2U:  { si: "U 3+, HLD 6-10", montre: "soutien simple, 6–10 points, 3+ cartes" }
  - 3U:  { si: "U 3+, HLD 11-12, (U 4+ || non P 5+)", montre: "soutien limite, 11–12 points ; avec trois atouts et cinq piques, 1♠ d'abord", source: à confirmer }
  - 4U:  { si: "S 3-4, U 3+, HLD 13-16", montre: "fit et 13–16 points : manche (le résumé débutant)", nature: conclusion, source: à confirmer }
  - 2C:  { si: "S 3-4, U 3+, HLD 17+, C 5+, C > K, C > T", montre: "17+ points, fit différé", apres: 1P }
  - 2K:  { si: "S 3-4, U 3+, HLD 17+, K 4+, K > T", montre: "17+ points, fit différé" }
  - 2T:  { si: "S 3-4, U 3+, HLD 17+, T 4+", montre: "17+ points, fit différé" }
  - 2K:  { si: "S 3-4, U 3+, HLD 17+, K > T", montre: "17+ points, fit différé" }
  - 2T:  { si: "S 3-4, U 3+, HLD 17+", montre: "17+ points, fit différé" }
  - passe: { si: "H 5-", montre: "moins de 6 H" }
  - 1P:  { si: "H 6+, P 4+", montre: "6+ H, 4+ piques" }
  - 1SA: { si: "H 6-10", montre: "6–10 H, sans fit" }
  - 2SA: { si: "reg, H 11-12, U 2-", montre: "11–12 H, régulier, sans fit : invitation (le résumé débutant)", nature: invite, source: à confirmer }
  - 3SA: { si: "reg, H 13-15, U 2-", montre: "13–15 H, régulier, sans fit : manche (le résumé débutant)", nature: conclusion, source: à confirmer }
  - 2C:  { si: "H 11+, C 5+, C > K, C > T", montre: "11+ H, 5+ cœurs, forcing", apres: 1P }
  - 2K:  { si: "H 11+, K 4+, K > T", montre: "11+ H, 4+ carreaux, forcing" }
  - 2T:  { si: "H 11+, T 4+", montre: "11+ H, 4+ trèfles, forcing" }
  - 2K:  { si: "H 11+, K > T", montre: "11+ H, forcing" }
  - 2T:  { si: "H 11+", montre: "11+ H, forcing" }
  - exemples:
      - { main: "R82 D75 RV73 X52", apres: 1C, attendu: 2U }     # 9 H, 3 cœurs
      - { main: "AV82 75 RV73 X52", apres: 1C, attendu: 1P }
      - { main: "AV82 75 RV73 X52", apres: 1P, attendu: 2U }     # 4 piques, 9 H + 1 (doubleton)
      - { main: "V82 R7 RV73 DV52", apres: 1P, attendu: 3U }
      - { main: "RX9832 X9 A632 9", apres: 1P, attendu: 4U }     # 6 atouts, singleton : manche
      - { main: "754 D5 ARV63 V94", apres: 1P, position: 2, attendu: 2T }   # main passée, 3 atouts, HLD 12 : Drury
      - { main: "754 X5 ARV63 V94", apres: 1P, position: 2, attendu: 2U }   # HLD 10 : le SEF 2024 veut 11 pour Drury
      - { main: "754 X5 ARV63 V94", apres: 1P, attendu: 2U }                # la même, pas passée : soutien simple
      - { main: "AD95 R852 RV4 63", apres: 1C, attendu: 4U }     # 4 atouts, 15 HLD : manche directe
      - { main: "D4 RV9 AD84 R963", apres: 1P, attendu: 3SA }    # 13 H régulier sans fit
      - { main: "D4 RV9 A984 R963", apres: 1P, attendu: 2SA }    # 11 H régulier sans fit
      - { main: "AD95 R852 AR4 A3", apres: 1C, attendu: 2K }     # 21 HLD : fit différé

